<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sternsprung</title>
<meta name="theme-color" content="#0a0718">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sternsprung">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<!--GAME-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Overpass:wght@500;700;800&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* Risodruck im All: flache Druckfarben auf Tinte, Rasterpunkte statt Verläufe,
   leicht verrutschte Farbschichten als harte Versatz-Schatten. Bewusst nur dunkel. */
:root{
  --ink:#0e1b24; --ink2:#152835; --line:#2b4352; --paper:#efe9dc; --mut:#93a7ad;
  --yellow:#ffd23a; --pink:#ff4f8b; --teal:#25b8a8; --orange:#ff7433;
  --disp:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));z-index:5}
#menu{background:radial-gradient(rgba(239,233,220,.05) 1px,transparent 1.6px) 0 0/7px 7px,rgba(14,27,36,.72)}
.gold .coin,.gold .tag{font-family:inherit;letter-spacing:0;font-size:inherit;color:inherit;text-transform:none}
.layer.dim{background:radial-gradient(rgba(239,233,220,.07) 1px,transparent 1.6px) 0 0/7px 7px,rgba(14,27,36,.88)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.big{font-family:var(--disp);font-size:26px;letter-spacing:.04em;padding:15px 40px 13px;border-radius:8px;color:var(--ink);
  background:var(--yellow);box-shadow:5px 5px 0 var(--pink);transition:transform .07s,box-shadow .07s}
.big:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--pink)}
.pulse{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:rotate(-2deg)}92%{transform:rotate(1.5deg)}}
.sm{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px 9px;border-radius:8px;
  border:2px solid var(--line);color:var(--paper);min-width:48px}
.sm:active{background:var(--line)}
.sm.off{color:var(--mut);text-decoration:line-through}
.gold{font-family:var(--disp);font-size:17px;letter-spacing:.02em;text-transform:none;color:var(--ink);background:var(--teal);border:0;box-shadow:4px 4px 0 var(--yellow);padding:12px 18px 10px}
.gold:disabled{background:var(--line);color:var(--mut);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.title{font-family:var(--disp);font-weight:400;font-size:clamp(46px,14vw,64px);line-height:.92;margin:0;color:var(--paper);
  text-shadow:5px 4px 0 var(--pink);display:flex;flex-direction:column;transform:rotate(-4deg)}
.title span:last-child{margin-left:.55em;color:var(--yellow);text-shadow:5px 4px 0 var(--teal)}
.sub{color:var(--mut);font-size:15px;font-weight:500;text-align:center;margin:6px 0 0}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:10px;padding:12px 14px;width:min(360px,100%)}
.card h3{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.mis{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.mis:first-of-type{border-top:0}
.mis .t{font-size:15px;font-weight:700;line-height:1.2}
.mis .r{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}
.bar{grid-column:1/-1;height:8px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,#d9aa1c 5px 10px);transition:width .5s}
.mis.done .bar i{background:var(--teal)}
.mis.done .t{color:var(--teal)}
.coin{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.coin::before{content:"★"}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.top>*{pointer-events:auto}
.pill{background:var(--ink2);border:2px solid var(--line);border-radius:8px;padding:7px 12px 5px;font-size:15px}
#score{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 54px);text-align:center;font-family:var(--disp);font-size:60px;
  line-height:1;pointer-events:none;z-index:4;color:var(--paper);text-shadow:4px 3px 0 var(--pink);font-variant-numeric:tabular-nums}
#score.bump{animation:bump .22s}
@keyframes bump{40%{transform:scale(1.18) rotate(-3deg)}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 13%);width:max-content;max-width:calc(100% - 32px);
  text-align:center;pointer-events:none;z-index:4;background:var(--yellow);color:var(--ink);padding:9px 14px 7px;border-radius:6px;box-shadow:4px 4px 0 var(--pink);
  font-family:var(--disp);font-size:17px;letter-spacing:.02em}
#hint small{display:block;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.06em;margin-top:3px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,24px);opacity:0;z-index:20;pointer-events:none;
  background:var(--yellow);color:var(--ink);border-radius:6px;padding:10px 14px 8px;font-weight:800;font-size:15px;box-shadow:4px 4px 0 var(--pink);
  transition:all .3s cubic-bezier(.2,1.5,.4,1);white-space:nowrap}
#toast .coin{color:var(--ink)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.stat{display:flex;gap:30px;justify-content:center}
.stat div{text-align:center}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat div:first-child b{text-shadow:4px 3px 0 var(--pink)}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.rec{font-family:var(--disp);color:var(--pink);font-size:18px;letter-spacing:.04em;border:3px solid var(--pink);border-radius:6px;padding:6px 12px 3px;transform:rotate(-7deg)}
.rank{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.12em}
.rank b{color:var(--paper);font-size:15px}
.xp{height:6px;width:120px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
.xp i{display:block;height:100%;background:var(--teal)}
#shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(380px,100%);overflow-y:auto;max-height:62vh;padding:2px 6px 6px 2px}
.sk{background:var(--ink2);border:2px solid var(--line);border-radius:10px;padding:12px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:800}
.sk.sel{border-color:var(--yellow)}
.sk .ball{width:30px;height:30px;border-radius:50%;margin:4px 0 6px}
.sk .p{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sk.sel .p{color:var(--yellow)}
.sk.lock .ball{opacity:.45}
.sk.lock{color:var(--mut)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>

</head>
<body>
<canvas id="c"></canvas>

<div class="top" id="topbar">
  <button class="sm pill hide" id="pauseBtn" aria-label="Pause">II</button>
  <span></span>
  <span class="pill coin" id="coins">0</span>
</div>
<div id="score" class="hide">0</div>
<div id="hint" class="hide"></div>
<div id="toast"></div>

<!-- Menü -->
<div class="layer" id="menu">
  <div style="flex:1"></div>
  <div class="tag" id="mExp">Expedition 001</div>
  <h1 class="title"><span>STERN</span><span>SPRUNG</span></h1>
  <p class="sub">Spring von Planet zu Planet. Triff die Mitte.</p>
  <div class="row" style="align-items:center;gap:22px;margin:6px 0 8px">
    <div class="rank">REKORD <b id="mBest">0</b></div>
    <div class="rank">RANG <b id="mRank">1</b><div class="xp"><i id="mXp" style="width:0"></i></div></div>
  </div>
  <button class="big pulse" id="playBtn">LOSFLIEGEN</button>
  <div class="row" style="margin-top:6px">
    <button class="sm" id="shopBtn">Skins</button>
    <button class="sm" id="sndBtn">Ton</button>
    <button class="sm" id="vibBtn">Vibration</button>
  </div>
  <div class="card" id="mMis"></div>
  <div style="flex:1.3"></div>
</div>

<!-- Pause -->
<div class="layer dim hide" id="pause">
  <h2 class="title" style="font-size:48px"><span>PAUSE</span></h2>
  <button class="big" id="resumeBtn">WEITER</button>
  <button class="sm" id="quitBtn">Zum Menü</button>
</div>

<!-- Game Over -->
<div class="layer dim hide" id="over">
  <div class="tag" id="oCause">Ins All gestürzt</div>
  <div class="rec hide" id="oRec">NEUER REKORD</div>
  <div class="stat">
    <div><b id="oScore">0</b><span>Punkte</span></div>
    <div><b id="oBest">0</b><span>Rekord</span></div>
  </div>
  <div class="coin" style="font-size:16px" id="oCoins">+0</div>
  <button class="sm gold hide" id="reviveBtn">Weiterfliegen für <span class="coin" style="color:inherit" id="reviveCost">60</span> <span class="tag" style="color:inherit" id="reviveT"></span></button>
  <button class="big" id="againBtn">NOCHMAL</button>
  <div class="card" id="oMis"></div>
  <button class="sm" id="menuBtn">Menü</button>
</div>

<!-- Shop -->
<div class="layer dim hide" id="shop">
  <h2 class="title" style="font-size:44px"><span>SKINS</span></h2>
  <span class="pill coin" id="shopCoins">0</span>
  <div id="shopGrid"></div>
  <button class="big" id="shopBack" style="font-size:20px;padding:12px 34px 10px">FERTIG</button>
</div>

<script>
'use strict';
(function(){
const $=s=>document.querySelector(s);
const cv=$('#c'), ctx=cv.getContext('2d');
const W=400; let H=700, SC=1, OX=0, DPR=1, VW=400, VH=700;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

/* ---------- Speicher ---------- */
const KEY='sternsprung_v1';
const DEF={best:0,coins:0,skin:'nova',owned:['nova'],sound:true,vib:true,ms:null,mlvl:{},rank:1,
  st:{runs:0,perfect:0,coins:0,gold:0,skip:0},day:'',streak:0,tut:0};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},DEF)}
S.st=Object.assign({},DEF.st,S.st||{}); S.mlvl=S.mlvl||{}; if(!Array.isArray(S.owned))S.owned=['nova'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Skins ---------- */
const SKINS=[
 {id:'nova',n:'Nova',cost:0,c:'#efe9dc',t:'#25b8a8'},
 {id:'ember',n:'Glut',cost:120,c:'#ff7433',t:'#ff4f8b'},
 {id:'lime',n:'Limette',cost:180,c:'#8fd14f',t:'#ffd23a'},
 {id:'rose',n:'Rosa',cost:250,c:'#ff4f8b',t:'#9a6bff'},
 {id:'violet',n:'Violett',cost:350,c:'#9a6bff',t:'#25b8a8'},
 {id:'sun',n:'Sonne',cost:500,c:'#ffd23a',t:'#ff7433'},
 {id:'ghost',n:'Geist',cost:700,c:'#efe9dc',t:'#6f8790',ghost:1},
 {id:'fire',n:'Feuer',cost:900,c:'#ffd23a',t:'fire'},
 {id:'ice',n:'Eiskristall',cost:1200,c:'#bff0ee',t:'ice'},
 {id:'rainbow',n:'Regenbogen',cost:1800,c:'#efe9dc',t:'rainbow'},
 {id:'void',n:'Leere',cost:2500,c:'#05090c',t:'#ff4f8b',ring:1},
 {id:'king',n:'Goldkönig',cost:4000,c:'#ffd23a',t:'gold',ring:1},
];
const skin=()=>SKINS.find(s=>s.id===S.skin)||SKINS[0];
function trailCol(sk,i,t){
  switch(sk.t){
    case 'fire':return `hsl(${10+i*2.2},100%,${55+i}%)`;
    case 'ice':return `hsl(${190+i*1.5},100%,${70+i*0.8}%)`;
    case 'rainbow':return ['#ff4f8b','#ffd23a','#25b8a8','#9a6bff'][Math.floor(t*6+i/4)%4];
    case 'gold':return `hsl(${42+Math.sin(t*6+i)*6},100%,${55+i}%)`;
    default:return sk.t;
  }
}

/* ---------- Aufgaben ---------- */
const MT={
 score:{txt:n=>`Erreiche ${n} Punkte in einer Runde`,steps:[8,15,22,30,40,50,65,80,100,125],run:1},
 perfect:{txt:n=>`Lande ${n} Volltreffer`,steps:[3,8,15,25,40,60,90,130]},
 streak:{txt:n=>`${n} Volltreffer hintereinander`,steps:[2,3,4,5,6,8,10],run:1},
 coins:{txt:n=>`Sammle ${n} Sterne`,steps:[10,25,50,80,120,200,300]},
 runs:{txt:n=>`Spiele ${n} Runden`,steps:[3,5,8,10,15,20]},
 gold:{txt:n=>`Lande auf ${n} Goldplaneten`,steps:[1,3,5,8,12,18]},
 skip:{txt:n=>`Überspringe ${n} Planeten`,steps:[1,3,6,10,15,25]},
};
function goalFor(k){const st=MT[k].steps,l=S.mlvl[k]||0;return l<st.length?st[l]:Math.round(st[st.length-1]*Math.pow(1.3,l-st.length+1))}
function newMission(exclude){
  const keys=Object.keys(MT).filter(k=>!exclude.includes(k));
  const k=keys[Math.floor(Math.random()*keys.length)];
  const lvl=S.mlvl[k]||0;
  return {k,g:goalFor(k),p:0,r:25+lvl*15};
}
function ensureMissions(){
  if(!Array.isArray(S.ms)||S.ms.length!==3||S.ms.some(m=>!m||!MT[m.k])){S.ms=[];
    for(let i=0;i<3;i++)S.ms.push(newMission(S.ms.map(m=>m.k)));save();}
  // erfüllte Aufgaben (z. B. App vor dem Tausch geschlossen) ersetzen
  S.ms.forEach((m,i)=>{if(m.p>=m.g)S.ms[i]=newMission(S.ms.filter(x=>x!==m).map(x=>x.k))});save();
}
ensureMissions();
function mEvent(k,val,isRunMax){
  let changed=false;
  S.ms.forEach((m,idx)=>{
    if(m.k!==k||m.p>=m.g)return;
    m.p=isRunMax?Math.max(m.p,val):m.p+val;
    if(m.p>=m.g){m.p=m.g;completeMission(idx)}
    changed=true;
  });
  if(changed)save();
}
function completeMission(idx){
  const m=S.ms[idx];
  S.coins+=m.r; S.rank++; S.mlvl[m.k]=(S.mlvl[m.k]||0)+1;
  toast(`Aufgabe erfüllt <span class="coin">+${m.r}</span> · Rang ${S.rank}`);
  sfx.mission(); buzz([20,40,20]);
  setTimeout(()=>{ // nach kurzer Zeit gegen neue tauschen
    const i=S.ms.indexOf(m); if(i<0)return;
    S.ms[i]=newMission(S.ms.filter(x=>x!==m).map(x=>x.k)); save(); renderMissions();
  },1800);
  updCoins();
}
function renderMissions(){
  const html='<h3>Aufgaben</h3>'+S.ms.map(m=>{
    const pct=Math.min(100,m.p/m.g*100);
    return `<div class="mis${m.p>=m.g?' done':''}"><span class="t">${MT[m.k].txt(m.g)}</span><span class="r">${m.p>=m.g?'erledigt':`${Math.floor(m.p)}/${m.g}`} · <span class="coin">${m.r}</span></span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  $('#mMis').innerHTML=html; $('#oMis').innerHTML=html;
  $('#mRank').textContent=S.rank;
  $('#mXp').style.width=(S.ms.reduce((a,m)=>a+Math.min(1,m.p/m.g),0)/3*100)+'%';
}

/* ---------- Ton & Vibration ---------- */
let AC=null,master=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
}
function tone(f,d,type,v,f2,delay){
  if(!S.sound||!AC)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
const PEN=[0,2,4,7,9];
const note=i=>392*Math.pow(2,(PEN[i%5]+12*Math.floor(i/5))/12);
const sfx={
  launch:()=>tone(260,.13,'triangle',.16,620),
  land:s=>{tone(note(4+Math.min(s,10)),.22,'sine',.26)},
  perfect:s=>{tone(note(6+Math.min(s,12)),.25,'triangle',.22);tone(note(8+Math.min(s,12)),.32,'sine',.2,null,.07)},
  coin:()=>{tone(1320,.06,'square',.05);tone(1980,.09,'square',.05,null,.05)},
  die:()=>{tone(420,.55,'sawtooth',.14,55);tone(90,.4,'sine',.3,40)},
  crumble:()=>tone(180,.25,'square',.07,60),
  click:()=>tone(700,.05,'sine',.12),
  mission:()=>{[0,2,4,7].forEach((k,i)=>tone(note(10+k),.18,'triangle',.15,null,i*.08))},
  zone:()=>{[0,4,7,12].forEach((k,i)=>tone(note(5)*Math.pow(2,k/12),.3,'sine',.15,null,i*.1))},
  tick:()=>tone(1000,.03,'square',.04),
};
function buzz(p){if(S.vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

/* ---------- Bildschirm ---------- */
let bgStars=[];
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  VW=window.innerWidth;VH=window.innerHeight;
  SC=Math.min(VW/W,VH/620);
  H=VH/SC;OX=(VW-W*SC)/2;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  bgStars=[];
  const n=Math.round(VW*VH/2600);
  for(let i=0;i<n;i++)bgStars.push({x:Math.random()*VW,y:Math.random()*VH,z:Math.random(),tw:Math.random()*TAU});
  if(G)for(const p of G.planets)p.spr=null;
}
window.addEventListener('resize',resize);

/* ---------- Grafik-Hilfen ---------- */
const C={ink:'#0e1b24',ink2:'#152835',paper:'#efe9dc',yellow:'#ffd23a',pink:'#ff4f8b',teal:'#25b8a8',blue:'#4a63ff',orange:'#ff7433',green:'#8fd14f',violet:'#9a6bff'};
const PCOL=[C.pink,C.teal,C.blue,C.orange,C.green,C.violet];
const INKS=['#0e1b24','#1b1531','#22170f','#0b2421','#1d1a1a','#161331','#102012'];
let grain=null;
function makeGrain(){ // Papierkorn, einmal vorgerechnet
  const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');
  for(let i=0;i<1400;i++){g.fillStyle=Math.random()<.5?'rgba(239,233,220,.05)':'rgba(0,0,0,.12)';g.fillRect(Math.random()*160,Math.random()*160,1,1)}
  grain=ctx.createPattern(c,'repeat');
}
function planetSprite(p){
  const pad=p.ring?2.1:1.3,size=p.r*2*pad,s=Math.ceil(size*SC*DPR)+2;
  const c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),k=s/size;g.scale(k,k);const m=size/2,r=p.r;
  const col=p.gold?C.yellow:PCOL[p.ci],col2=p.gold?C.orange:PCOL[p.c2];
  const ringPath=(front)=>{g.save();g.translate(m,m);g.rotate(-.35);g.beginPath();
    g.ellipse(0,0,r*1.85,r*.5,0,front?0:Math.PI,front?Math.PI:TAU);g.lineWidth=r*.13;
    g.strokeStyle=C.paper;g.stroke();g.restore();};
  if(p.ring)ringPath(false);
  // verrutschte zweite Farbschicht
  g.fillStyle=col2;g.beginPath();g.arc(m+r*.09,m+r*.06,r,0,TAU);g.fill();
  g.fillStyle=col;g.beginPath();g.arc(m,m,r,0,TAU);g.fill();
  g.save();g.beginPath();g.arc(m,m,r,0,TAU);g.clip();
  if(p.gold){g.fillStyle=C.orange;for(let i=-2;i<=2;i++)g.fillRect(m-r,m+i*r*.38-r*.07,r*2,r*.14)}
  else if(p.band){g.fillStyle=col2;for(let i=-1;i<=1;i++)g.fillRect(m-r,m+i*r*.5-r*.06,r*2,r*.12)}
  else{g.fillStyle='rgba(14,27,36,.28)';for(const q of p.cr){g.beginPath();g.arc(m+q[0]*r,m+q[1]*r,q[2]*r,0,TAU);g.fill()}}
  // Rasterpunkte als Schatten (Licht von oben links)
  const d=Math.max(3.2,r*.15);g.fillStyle='rgba(14,27,36,.6)';
  for(let y=-r,row=0;y<=r;y+=d*.87,row++)for(let x=-r+(row%2?d/2:0);x<=r;x+=d){
    const sh=clamp((x*.62+y*.78)/r*.75+.18,0,1);if(sh<.08)continue;
    g.beginPath();g.arc(m+x,m+y,d*.52*sh,0,TAU);g.fill();
  }
  g.restore();
  if(p.ring)ringPath(true);
  p.spr=c;p.sprSize=size;
}
function star(x,y,R,r,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore()}
function printText(t,x,y,size,col,off){ // Text mit verrutschter Schattenfarbe
  ctx.font=`${size}px ${FONT}`;ctx.fillStyle=off||C.ink;ctx.fillText(t,x+size*.08,y+size*.07);ctx.fillStyle=col;ctx.fillText(t,x,y)}

/* ---------- Spielwelt ---------- */
let G=null,mode='menu';
function mkPlanet(i){
  const R=rnd(Math.max(42,64-i*.28),Math.max(54,82-i*.3));
  const cr=[];for(let k=0;k<4;k++)cr.push([rnd(-.7,.7),rnd(-.7,.7),rnd(.1,.26)]);
  return {i,x:W/2,bx:W/2,y:0,R,r:R*rnd(.36,.46),ci:Math.floor(rnd(0,6)),c2:Math.floor(rnd(0,6)),amp:0,sp:0,ph:rnd(0,TAU),
    w:(160+Math.min(i,90)*1.7)/R,gold:false,ring:Math.random()<.22,band:Math.random()<.35,cr,
    tmax:Math.max(1.7,4.6-i*.045),timer:0,dead:false,visited:false,pulse:0,spr:null};
}
function newWorld(){
  G={planets:[],coins:[],rocks:[],holes:[],parts:[],rings:[],texts:[],t:0,score:0,maxIdx:0,streak:0,bestStreak:0,got:0,
     camY:0,shake:0,hit:0,started:false,zone:0,deadT:0,revived:false,paid:0,counted:false,flash:0,lastLand:null,cause:''};
  const p0=mkPlanet(0);p0.R=72;p0.r=30;p0.y=0;p0.tmax=Infinity;p0.visited=true;p0.ci=1;p0.c2=2;p0.ring=true;
  G.planets.push(p0);G.last=p0;G.lastLand=p0;
  G.camY=p0.y-H*.66;
  G.P={st:'orbit',p:p0,a:-Math.PI/2,rad:p0.R,dir:1,x:p0.x,y:p0.y-p0.R,vx:0,vy:0,ft:0,from:null,trail:[]};
  generate();
}
function generate(){
  while(G.last.y>G.camY-H*.7){
    const L=G.last,i=L.i+1,p=mkPlanet(i);
    const gap=Math.max(rnd(150,205)+Math.min(i,60)*1.0,L.R+p.R+28);
    p.y=L.y-gap;
    const m=p.R+12;
    if(i<4){p.x=clamp(L.x+rnd(-120,120),m+20,W-m-20)}
    else{let t=0;do{p.x=rnd(m,W-m);t++}while(t<8&&Math.abs(p.x-L.x)<40)}
    p.bx=p.x;
    if(i>=7&&Math.random()<Math.min(.55,.18+(i-7)*.02)){
      const amp=Math.min(rnd(35,95),p.bx-m,W-m-p.bx);
      if(amp>22){p.amp=amp;p.sp=rnd(.6,1.1)+Math.min(i,80)*.006}
    }
    if(i>3&&Math.random()<.08){p.gold=true;p.ring=false}
    // Sterne auf der direkten Linie -> belohnt mutige, gerade Sprünge
    if(Math.random()<.7){for(let k=1;k<=3;k++){const f=.3+k*.1;
      G.coins.push({x:L.bx+(p.bx-L.bx)*f,y:L.y+(p.y-L.y)*f,ph:rnd(0,TAU),got:false})}}
    // Asteroiden zwischen Planeten
    const rr=rnd(9,15);
    if(i>=12&&Math.random()<Math.min(.5,.18+(i-12)*.012)&&gap>=L.R+p.R+2*(rr+10)){
      const lo=p.y+p.R+rr+10,hi=L.y-L.R-rr-10;
      G.rocks.push({x:rnd(0,W),y:rnd(lo,hi),vx:(Math.random()<.5?-1:1)*rnd(50,85+Math.min(i,80)),r:rr,a:0,va:rnd(-3,3),
        pts:Array.from({length:9},(_,k)=>[k/9*TAU,rnd(.75,1.15)])});
    }
    // Schwarze Löcher neben dem Weg
    if(i>=28&&Math.random()<.16){
      const hr=rnd(15,22);
      for(let t=0;t<10;t++){const hx=rnd(hr+10,W-hr-10),hy=rnd(p.y,L.y);
        if(Math.hypot(hx-L.x,hy-L.y)>L.R+hr+30+L.amp&&Math.hypot(hx-p.bx,hy-p.y)>p.R+hr+30+p.amp){G.holes.push({x:hx,y:hy,r:hr});break}}
    }
    G.planets.push(p);G.last=p;
  }
}
function startRun(){
  newWorld();G.started=false;mode='play';
  showOnly(null);$('#score').classList.remove('hide');$('#pauseBtn').classList.remove('hide');
  setScore(0);
  if(S.tut<2){showHint(S.tut===0?'Tippe, um abzuspringen<small>Fliege in den Ring des nächsten Planeten</small>':'Ziele genau auf die Mitte<small>Volltreffer geben Extrapunkte</small>')}
}
function showHint(h){const e=$('#hint');e.innerHTML=h;e.classList.remove('hide')}
function hideHint(){$('#hint').classList.add('hide')}

function tap(){
  if(mode!=='play')return;
  const P=G.P;
  if(P.st==='orbit'){G.started=true;launch()}
}
function launch(){
  const P=G.P,p=P.p;
  const tx=-Math.sin(P.a)*P.dir,ty=Math.cos(P.a)*P.dir;
  const sp=470+Math.min(G.score,90)*2.2;
  const pvx=p.amp?p.amp*p.sp*Math.cos(G.t*p.sp+p.ph):0;
  P.vx=tx*sp+pvx;P.vy=ty*sp;P.st='fly';P.from=p;P.p=null;P.ft=0;
  sfx.launch();buzz(8);
  for(let k=0;k<8;k++)part(P.x,P.y,-tx*rnd(40,140)+rnd(-40,40),-ty*rnd(40,140)+rnd(-40,40),.4,trailCol(skin(),k,G.t),2.5);
}
function capture(p,dx,dy){
  const P=G.P,v=Math.hypot(P.vx,P.vy)||1;
  const cr=dx*P.vy-dy*P.vx,b=Math.abs(cr)/v;
  P.st='orbit';P.p=p;P.a=Math.atan2(dy,dx);P.rad=Math.hypot(dx,dy);P.dir=cr>=0?1:-1;P.from=null;
  p.timer=p.tmax;p.pulse=1;G.lastLand=p;
  const perfect=b<p.R*.36;
  let gained=0,txt='',col=C.paper;
  if(p.i>G.maxIdx){
    const adv=p.i-G.maxIdx;gained=adv;G.maxIdx=p.i;
    if(adv>1){S.st.skip+=adv-1;mEvent('skip',adv-1);txt=`SPRUNG ×${adv}`;col=C.violet}
    if(perfect){G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);const bonus=Math.min(G.streak,5);gained+=bonus;
      txt=G.streak>1?`VOLLTREFFER ×${G.streak}`:'VOLLTREFFER!';col=C.yellow;
      S.st.perfect++;mEvent('perfect',1);mEvent('streak',G.streak,true);
      G.hit=.07;G.shake=Math.max(G.shake,5);G.flash=.25;sfx.perfect(G.streak);buzz([15,30,25]);
      ring(p.x,p.y,p.R,C.yellow,.5);ring(p.x,p.y,p.R*.6,C.pink,.35);
      for(let k=0;k<26;k++){const a=rnd(0,TAU),s=rnd(80,260);part(P.x,P.y,Math.cos(a)*s,Math.sin(a)*s,rnd(.4,.8),k%2?C.yellow:C.pink,4)}
    }else{G.streak=0;sfx.land(G.score%15);buzz(12);ring(p.x,p.y,p.R,C.teal,.35)}
    if(p.gold){S.coins+=5;G.got+=5;S.st.gold++;mEvent('gold',1);text(p.x,p.y-p.R-26,'+5 ★',C.yellow,15);sfx.coin()}
    if(p.i===1&&S.tut===0){S.tut=1;save();hideHint();setTimeout(()=>{if(mode==='play'&&G.score<4)showHint('Ziele genau auf die Mitte<small>Volltreffer geben Extrapunkte</small>')},500)}
    if(perfect&&S.tut===1){S.tut=2;save();hideHint()}
    if(G.score+gained>=5&&S.tut<2){S.tut=2;save();hideHint()}
  }else{G.streak=0;sfx.land(0);ring(p.x,p.y,p.R,C.paper,.3)}
  if(gained>0){
    setScore(G.score+gained);mEvent('score',G.score,true);
    text(p.x,p.y-p.R-10,txt?`${txt}  +${gained}`:`+${gained}`,col,txt?16:15);
    const z=Math.floor(G.score/25);
    if(z>G.zone){G.zone=z;bigText(`ZONE ${z+1}`);sfx.zone()}
  }
}
function die(cause){
  const P=G.P;if(P.st==='dead')return;
  P.st='dead';G.deadT=0;G.cause=cause;G.shake=12;G.flash=.35;
  sfx.die();buzz([40,40,90]);
  const sk=skin();
  for(let k=0;k<40;k++){const a=rnd(0,TAU),s=rnd(40,300);part(P.x,P.y,Math.cos(a)*s,Math.sin(a)*s,rnd(.5,1.1),k%3?sk.c:trailCol(sk,k,G.t),3.2)}
}
function collapse(p){
  p.dead=true;sfx.crumble();G.shake=Math.max(G.shake,4);
  for(let k=0;k<30;k++){const a=rnd(0,TAU),s=rnd(30,200);part(p.x+Math.cos(a)*p.r*.6,p.y+Math.sin(a)*p.r*.6,Math.cos(a)*s,Math.sin(a)*s,rnd(.5,1),PCOL[p.ci],5)}
}
function part(x,y,vx,vy,life,c,s){if(G.parts.length<500)G.parts.push({x,y,vx,vy,life,max:life,c,s})}
function ring(x,y,r,c,life){G.rings.push({x,y,r,c,life,max:life})}
function text(x,y,t,c,size){G.texts.push({x,y,t,c,size,life:1.1,max:1.1})}
let bigT=null;function bigText(t){bigT={t,life:1.6}}

/* ---------- Update ---------- */
const STEP=1/120;
function update(dt){
  G.t+=dt;
  for(const p of G.planets){if(p.amp)p.x=p.bx+Math.sin(G.t*p.sp+p.ph)*p.amp;if(p.pulse>0)p.pulse=Math.max(0,p.pulse-dt*2.5)}
  for(const r of G.rocks){r.x+=r.vx*dt;r.a+=r.va*dt;if(r.x<-r.r-20)r.x=W+r.r+20;else if(r.x>W+r.r+20)r.x=-r.r-20}
  const P=G.P;
  if(P.st==='orbit'){
    const p=P.p;
    P.a+=P.dir*p.w*dt;P.rad+=(p.R-P.rad)*Math.min(1,dt*9);
    P.x=p.x+Math.cos(P.a)*P.rad;P.y=p.y+Math.sin(P.a)*P.rad;
    if(mode==='play'&&G.started&&isFinite(p.tmax)){
      const before=p.timer;p.timer-=dt;
      if(p.timer<1&&Math.floor(before*4)!==Math.floor(p.timer*4))sfx.tick();
      if(p.timer<=0){collapse(p);launch()}
    }
  }else if(P.st==='fly'){
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.ft+=dt;
    for(const p of G.planets){
      if(p.dead||p===P.from)continue;
      const dx=P.x-p.x,dy=P.y-p.y;
      if(dx*dx+dy*dy<=p.R*p.R){capture(p,dx,dy);break}
    }
    if(P.st==='fly'){
      for(const h of G.holes)if(Math.hypot(P.x-h.x,P.y-h.y)<h.r+5){die('Vom Schwarzen Loch verschluckt');break}
    }
    if(P.st==='fly'&&(P.x<-14||P.x>W+14||P.y>G.camY+H+30||P.ft>3))die('Ins All gestürzt');
  }else if(P.st==='dead'){
    G.deadT+=dt;
    if(G.deadT>1&&mode==='play')showOver();
  }
  if(P.st!=='dead'){
    for(const r of G.rocks)if(Math.hypot(P.x-r.x,P.y-r.y)<r.r+5){die('Vom Asteroiden getroffen');break}
  }
  // Sterne einsammeln
  if(P.st!=='dead')for(const c of G.coins){
    if(!c.got&&Math.abs(P.x-c.x)<20&&Math.abs(P.y-c.y)<20){c.got=true;S.coins++;G.got++;S.st.coins++;mEvent('coins',1);sfx.coin();updCoins();
      for(let k=0;k<8;k++){const a=rnd(0,TAU);part(c.x,c.y,Math.cos(a)*90,Math.sin(a)*90,.35,C.yellow,3)}}
  }
  // Spur
  if(P.st!=='dead'){P.trail.push(P.x,P.y);if(P.trail.length>44)P.trail.splice(0,2)}
  // Kamera
  let ty=G.camY;
  if(P.st==='orbit')ty=P.p.y-H*.64;
  else if(P.st==='fly'&&P.y-H*.3<G.camY)ty=P.y-H*.3;
  G.camY+=(ty-G.camY)*(1-Math.exp(-dt*3.2));
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*40);
  if(G.flash>0)G.flash-=dt;
  // Effekte
  for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.life-=dt;if(q.life<=0){G.parts.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-dt*2.2;q.vy*=1-dt*2.2}
  for(let i=G.rings.length-1;i>=0;i--){if((G.rings[i].life-=dt)<=0)G.rings.splice(i,1)}
  for(let i=G.texts.length-1;i>=0;i--){const q=G.texts[i];q.y-=dt*40;if((q.life-=dt)<=0)G.texts.splice(i,1)}
  if(bigT&&(bigT.life-=dt)<=0)bigT=null;
  generate();
  // Aufräumen unterhalb
  const lim=G.camY+H+250;
  G.planets=G.planets.filter(p=>p.y<lim||p===P.p||p===G.lastLand||p===G.last);
  G.coins=G.coins.filter(c=>c.y<lim&&!(c.got&&c.y>G.camY+H));
  G.rocks=G.rocks.filter(r=>r.y<lim);G.holes=G.holes.filter(h=>h.y<lim);
}

/* ---------- Zeichnen ---------- */
const FONT='"Dela Gothic One","Arial Black",Impact,sans-serif';
const MONO='"Overpass Mono",ui-monospace,Menlo,monospace';
function draw(){
  const t=G.t;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=INKS[G.zone%INKS.length];ctx.fillRect(0,0,VW,VH);
  if(!grain)makeGrain();
  ctx.fillStyle=grain;ctx.fillRect(0,0,VW,VH);
  // Sterne im Hintergrund mit Parallaxe
  ctx.fillStyle=C.paper;
  for(const s of bgStars){
    const y=((s.y-G.camY*SC*(.05+s.z*.25))%VH+VH)%VH;
    ctx.globalAlpha=.25+s.z*.5;
    if(s.z>.93){ctx.fillRect(s.x-3,y,7,1.4);ctx.fillRect(s.x,y-3,1.4,7)}else{const r=1+s.z;ctx.fillRect(s.x,y,r,r)}
  }
  ctx.globalAlpha=1;
  let sx=0,sy=0;if(G.shake>0){sx=rnd(-G.shake,G.shake);sy=rnd(-G.shake,G.shake)}
  const k=DPR*SC;
  ctx.setTransform(k,0,0,k,DPR*(OX+sx),DPR*(-G.camY*SC+sy));
  if(OX>4){ctx.fillStyle=C.ink2;ctx.fillRect(-4,G.camY-20,4,H+40);ctx.fillRect(W,G.camY-20,4,H+40)}
  const P=G.P,top=G.camY-100,bot=G.camY+H+100;
  // Ziel-Hilfe
  if(P.st==='orbit'&&mode!=='over'){
    const tx=-Math.sin(P.a)*P.dir,ty=Math.cos(P.a)*P.dir;
    const len=(S.st.runs<3&&G.maxIdx<3)?300:48;
    ctx.save();ctx.setLineDash([2,8]);ctx.lineDashOffset=-t*30;ctx.lineCap='round';ctx.strokeStyle=C.paper;ctx.globalAlpha=.6;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+tx*len,P.y+ty*len);ctx.stroke();ctx.restore();
  }
  // Schwarze Löcher
  for(const h of G.holes){if(h.y<top||h.y>bot)continue;
    ctx.save();ctx.translate(h.x,h.y);
    ctx.strokeStyle=C.pink;ctx.lineWidth=2;ctx.setLineDash([3,5]);
    for(let j=0;j<3;j++){ctx.lineDashOffset=t*(20+j*10)*(j%2?1:-1);ctx.beginPath();ctx.arc(0,0,h.r*(1.25+j*.38),0,TAU);ctx.stroke()}
    ctx.setLineDash([]);ctx.fillStyle=C.pink;ctx.beginPath();ctx.arc(2.5,2,h.r,0,TAU);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,h.r,0,TAU);ctx.fill();ctx.restore();
  }
  // Planeten
  ctx.textAlign='left';ctx.textBaseline='middle';
  for(const p of G.planets){
    if(p.dead||p.y<top-p.R||p.y>bot+p.R)continue;
    const cur=P.p===p,vis=p.visited&&!cur,col=p.gold?C.yellow:PCOL[p.ci];
    ctx.globalAlpha=vis?.45:1;
    // Fangring: gepunktet = noch frei, durchgezogen = hier bist du
    ctx.save();ctx.strokeStyle=cur?C.paper:col;
    if(cur){ctx.globalAlpha*=.35;ctx.lineWidth=1.5}else{ctx.setLineDash([.1,9]);ctx.lineCap='round';ctx.lineWidth=3.2;ctx.lineDashOffset=t*12}
    ctx.beginPath();ctx.arc(p.x,p.y,p.R+p.pulse*14,0,TAU);ctx.stroke();ctx.restore();
    if(!p.spr)planetSprite(p);
    const wob=(cur&&p.timer<1&&G.started)?Math.sin(t*60)*1.5:0,sz=p.sprSize;
    ctx.drawImage(p.spr,p.x-sz/2+wob,p.y-sz/2,sz,sz);
    // Katalognummer
    if(!p.visited){ctx.font=`700 9px ${MONO}`;ctx.fillStyle=C.paper;ctx.globalAlpha=.55;
      ctx.fillText((p.gold?'AU-':'P-')+String(p.i).padStart(3,'0'),p.x+p.R*.74,p.y-p.R*.74)}
    ctx.globalAlpha=1;
    // Zeit-Ring
    if(cur&&isFinite(p.tmax)&&G.started&&mode!=='menu'){
      const f=clamp(p.timer/p.tmax,0,1);
      ctx.strokeStyle=f>.5?C.teal:f>.25?C.yellow:C.pink;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.R+7,-Math.PI/2,-Math.PI/2+TAU*f);ctx.stroke();
    }
  }
  // Sterne (Währung)
  for(const c of G.coins){if(c.got||c.y<top||c.y>bot)continue;
    const b=Math.sin(t*3+c.ph)*3,rot=Math.sin(t*2+c.ph)*.3;
    star(c.x+1.8,c.y+b+1.5,9,4,rot,C.pink);star(c.x,c.y+b,9,4,rot,C.yellow);
  }
  // Asteroiden
  for(const r of G.rocks){if(r.y<top||r.y>bot)continue;
    for(const pass of [0,1]){
      ctx.save();ctx.translate(r.x+(pass?0:2.5),r.y+(pass?0:2));ctx.rotate(r.a);ctx.beginPath();
      r.pts.forEach((q,j)=>{const x=Math.cos(q[0])*r.r*q[1],y=Math.sin(q[0])*r.r*q[1];j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();
      ctx.fillStyle=pass?'#8a7a6c':C.orange;ctx.fill();
      if(pass){ctx.fillStyle='rgba(14,27,36,.35)';ctx.beginPath();ctx.arc(r.r*.25,-r.r*.2,r.r*.28,0,TAU);ctx.fill()}
      ctx.restore();
    }
  }
  // Spur + Spieler
  const sk=skin();
  if(P.st!=='dead'){
    const tr=P.trail,n=tr.length/2;
    for(let i=0;i<n;i+=2){const f=i/n;ctx.globalAlpha=.25+f*.75;ctx.fillStyle=trailCol(sk,i,t);
      const s=1.5+f*4.5;ctx.beginPath();ctx.arc(tr[i*2],tr[i*2+1],s,0,TAU);ctx.fill()}
    ctx.globalAlpha=sk.ghost?.55+.3*Math.sin(t*8):1;
    const tc=sk.t.startsWith('#')?sk.t:trailCol(sk,20,t);
    ctx.fillStyle=tc;ctx.beginPath();ctx.arc(P.x+2.2,P.y+1.8,8,0,TAU);ctx.fill();
    ctx.fillStyle=sk.c;ctx.beginPath();ctx.arc(P.x,P.y,8,0,TAU);ctx.fill();
    if(sk.ring){ctx.strokeStyle=tc;ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.lineDashOffset=t*20;ctx.beginPath();ctx.arc(P.x,P.y,12.5,0,TAU);ctx.stroke();ctx.setLineDash([])}
    ctx.globalAlpha=1;
  }
  // Effekte (flach, wie Konfetti aus der Druckerei)
  for(const q of G.parts){const f=q.life/q.max;ctx.globalAlpha=Math.min(1,f*1.6);ctx.fillStyle=q.c;const s=q.s*(.5+f*.7);ctx.fillRect(q.x-s/2,q.y-s/2,s,s)}
  for(const r of G.rings){const f=1-r.life/r.max;ctx.globalAlpha=1-f;ctx.strokeStyle=r.c;ctx.lineWidth=4*(1-f)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r+f*40,0,TAU);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const q of G.texts){ctx.globalAlpha=Math.min(1,q.life/q.max*2);ctx.font=`${q.size}px ${FONT}`;const hw=ctx.measureText(q.t).width/2+8;printText(q.t,clamp(q.x,hw,W-hw),q.y,q.size,q.c)}
  ctx.globalAlpha=1;
  // Bildschirm-Ebene
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(bigT){const f=bigT.life/1.6;ctx.globalAlpha=Math.min(1,f*2.5);ctx.textAlign='center';
    printText(bigT.t,VW/2,VH*.3-(1-f)*30,Math.round(48*Math.min(SC,1.4)),C.yellow,C.pink);ctx.globalAlpha=1}
  if(G.flash>0){ctx.fillStyle=C.paper;ctx.globalAlpha=G.flash*.3;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1}
  // Warnung: Planet zerfällt gleich -> blinkender Rahmen
  if(P.st==='orbit'&&G.started&&isFinite(P.p.tmax)&&P.p.timer<1&&mode==='play'&&Math.sin(t*24)>0){
    ctx.strokeStyle=C.pink;ctx.lineWidth=10;ctx.strokeRect(0,0,VW,VH);
  }
}

/* ---------- UI ---------- */
const layers=['menu','pause','over','shop'];
function showOnly(id){layers.forEach(l=>$('#'+l).classList.toggle('hide',l!==id))}
function updCoins(){$('#coins').textContent=S.coins;$('#shopCoins').textContent=S.coins}
let lastScore=-1;
function setScore(v){G.score=v;if(v!==lastScore){const e=$('#score');e.textContent=v;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');lastScore=v}}
let toastT=0;
function toast(h){const e=$('#toast');e.innerHTML=h;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
function goMenu(){
  mode='menu';newWorld();showOnly('menu');hideHint();
  $('#score').classList.add('hide');$('#pauseBtn').classList.add('hide');
  $('#mBest').textContent=S.best;$('#mExp').textContent='Expedition '+String(S.st.runs+1).padStart(3,'0');renderMissions();updCoins();
}
let reviveTimer=0;
function reviveCost(){return 40+G.score*2}
function showOver(){
  mode='over';
  if(!G.counted){G.counted=true;S.st.runs++;mEvent('runs',1)}
  const bonus=Math.floor(G.score/3),add=bonus-G.paid;if(add>0){S.coins+=add;G.paid=bonus}
  const rec=G.score>S.best;if(rec)S.best=G.score;
  save();
  $('#oCause').textContent=G.cause;
  $('#oScore').textContent=G.score;$('#oBest').textContent=S.best;
  $('#oRec').classList.toggle('hide',!rec||G.score===0);
  $('#oCoins').textContent=`+${G.got+G.paid} Sterne`;
  const rb=$('#reviveBtn'),cost=reviveCost();
  $('#reviveCost').textContent=cost;
  const can=!G.revived&&G.score>=5;
  rb.classList.toggle('hide',!can);rb.disabled=S.coins<cost;
  if(can){let n=5;$('#reviveT').textContent=S.coins<cost?'· zu wenig':`· ${n}`;clearInterval(reviveTimer);
    reviveTimer=setInterval(()=>{n--;if(n<=0){clearInterval(reviveTimer);rb.classList.add('hide')}else if(S.coins>=cost)$('#reviveT').textContent=`· ${n}`},1000)}
  renderMissions();updCoins();showOnly('over');$('#score').classList.add('hide');
  $('#pauseBtn').classList.add('hide');hideHint();
}
function revive(){
  const cost=reviveCost();if(S.coins<cost||G.revived)return;
  clearInterval(reviveTimer);S.coins-=cost;G.revived=true;save();updCoins();
  const p=G.lastLand;p.dead=false;p.spr=null;if(!G.planets.includes(p))G.planets.push(p);
  // Gefahren in der Nähe entfernen
  G.rocks=G.rocks.filter(r=>Math.abs(r.y-p.y)>p.R+40);
  const P=G.P;P.st='orbit';P.p=p;P.a=-Math.PI/2;P.rad=p.R;P.trail=[];P.from=null;
  p.timer=p.tmax+1.5;G.started=false;mode='play';showOnly(null);$('#score').classList.remove('hide');
  $('#pauseBtn').classList.remove('hide');showHint('Tippe zum Weiterfliegen');sfx.zone();
}
function pause(){if(mode!=='play')return;mode='pause';showOnly('pause')}
function resume(){mode='play';showOnly(null);last=performance.now()}
function renderShop(){
  updCoins();
  $('#shopGrid').innerHTML=SKINS.map(s=>{
    const own=S.owned.includes(s.id),sel=S.skin===s.id;
    const tc=s.t.startsWith('#')?s.t:{fire:C.orange,ice:'#7fe9ff',rainbow:C.pink,gold:C.orange}[s.t];
    const bg=s.t==='rainbow'?`conic-gradient(${C.pink} 0 25%,${C.yellow} 0 50%,${C.teal} 0 75%,${C.violet} 0)`:s.c;
    return `<button class="sk${sel?' sel':''}${own?'':' lock'}" data-id="${s.id}"><span class="ball" style="background:${bg};box-shadow:4px 3px 0 ${tc}${s.ring?`,0 0 0 4px ${C.ink2},0 0 0 6px ${tc}`:''}"></span>${s.n}
      <span class="p">${sel?'Aktiv':own?'Wählen':`<span class="coin">${s.cost}</span>`}</span></button>`;
  }).join('');
}
$('#shopGrid').addEventListener('click',e=>{
  const b=e.target.closest('.sk');if(!b)return;const s=SKINS.find(x=>x.id===b.dataset.id);
  if(S.owned.includes(s.id)){S.skin=s.id;sfx.click()}
  else if(S.coins>=s.cost){S.coins-=s.cost;S.owned.push(s.id);S.skin=s.id;sfx.mission();buzz(30);toast(`Neuer Skin: ${s.n}!`)}
  else{toast(`Dir fehlen noch <span class="coin">${s.cost-S.coins}</span>`);sfx.tick();return}
  save();renderShop();
});
function bindBtn(id,fn){$(id).addEventListener('click',e=>{audio();sfx.click();fn(e)})}
bindBtn('#playBtn',startRun);
bindBtn('#againBtn',()=>{clearInterval(reviveTimer);startRun()});
bindBtn('#menuBtn',()=>{clearInterval(reviveTimer);goMenu()});
bindBtn('#reviveBtn',revive);
bindBtn('#pauseBtn',pause);
bindBtn('#resumeBtn',resume);
bindBtn('#quitBtn',()=>{if(!G.counted&&G.score>0){G.cause='';showOver();goMenu()}else goMenu()});
bindBtn('#shopBtn',()=>{renderShop();showOnly('shop')});
bindBtn('#shopBack',()=>{showOnly('menu');renderMissions()});
function syncToggles(){$('#sndBtn').classList.toggle('off',!S.sound);$('#vibBtn').classList.toggle('off',!S.vib)}
bindBtn('#sndBtn',()=>{S.sound=!S.sound;save();syncToggles()});
bindBtn('#vibBtn',()=>{S.vib=!S.vib;save();syncToggles();buzz(30)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();tap()});
window.addEventListener('keydown',e=>{
  if(e.code!=='Space'&&e.code!=='Enter'&&e.code!=='ArrowUp')return;
  if(mode==='play'){e.preventDefault();audio();tap()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Tägliche Belohnung ---------- */
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){
  const now=new Date(),today=dayStr(now);if(S.day===today)return;
  const y=new Date(now);y.setDate(y.getDate()-1);
  S.streak=S.day===dayStr(y)?S.streak+1:1;S.day=today;
  const gift=15*Math.min(S.streak,7)+(S.streak%7===0?50:0);
  S.coins+=gift;save();updCoins();
  setTimeout(()=>toast(`Tag ${S.streak} in Folge <span class="coin">+${gift}</span>`),600);
}

/* ---------- Hauptschleife ---------- */
let last=performance.now(),acc=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode!=='pause'&&mode!=='shop'){
    if(G.hit>0)G.hit-=dt;
    else{acc+=dt;let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++}if(n>=8)acc=0}
  }
  try{draw()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
resize();goMenu();syncToggles();daily();
requestAnimationFrame(frame);

// Testzugang (wird nur von automatischen Tests benutzt)
window.__ss={get G(){return G},get mode(){return mode},get S(){return S},update,tap,startRun,goMenu,revive,showOver,W,get H(){return H}};

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
